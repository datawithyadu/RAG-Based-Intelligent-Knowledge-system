[project]
name = "rag-based-intelligent-knowledge-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yadukrishnan m", email = "yadukrishnan152@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.89",
    "chromadb>=1.5.9",
    "experimental>=0.9.7",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.0",
    "uvicorn>=0.52.4",
]
[project.scripts]
ragkb = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
