[project]
name = "rag-based-intelligent-knowledge-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yadukrishnan m", email = "yadukrishnan152@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.85",
    "chromadb>=1.5.9",
    "flask>=3.1.3",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "openai>=3.6.0",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.5",
]

[project.scripts]
rag-based-intelligent-knowledge-system = "rag_based_intelligent_knowledge_system:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"